[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-scribe-api"
version = "0.1.0"
description = "Audio to piano sheet music, with a durable local job queue"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn[standard]>=0.34.2,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8.1,<3",
  "music21==9.7.1",
  "numpy>=1.26.4,<2",
  "pypdf>=5.4,<7",
]

[project.optional-dependencies]
transcription = [
  "basic-pitch==0.4.0",
  # Basic Pitch pins resampy <0.4.3, which imports the removed pkg_resources API.
  "setuptools>=75,<81",
]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real Basic Pitch and MuseScore pipeline (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
