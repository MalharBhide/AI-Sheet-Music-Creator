services:
  backend:
    build: ./backend
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STORAGE_ROOT: /data
      MUSESCORE_BIN: /usr/bin/musescore3
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-0}"
      MAX_AUDIO_SECONDS: "${MAX_AUDIO_SECONDS:-0}"
      JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-0}"
      RENDER_TIMEOUT_SECONDS: "${RENDER_TIMEOUT_SECONDS:-0}"
      RETENTION_HOURS: "${RETENTION_HOURS:-24}"
    volumes:
      - sheet-music-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health'))['ready']"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sheet-music-data:
