server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The API can enforce an optional MAX_UPLOAD_MB. No default file size cap.
    client_max_body_size 0;
    client_body_timeout 300s;
    add_header X-Content-Type-Options nosniff always;
    # Refresh HTML and API responses after deployments. An old page must not
    # pair its zero-byte validator with a backend that now supports unlimited uploads.
    add_header Cache-Control "no-store" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        # Inactivity timeouts, not total upload/processing deadlines.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    location /assets/ {
        # Hashed assets are immutable. Missing old hashes must return 404, not HTML.
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
